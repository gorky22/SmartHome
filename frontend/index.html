<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartHome — Devices</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>SmartHome — Devices</h1>
      </header>
      <main>
        <aside id="device-list" class="panel">
          <h2>Devices</h2>
          <ul id="devices"></ul>
        </aside>

        <section id="device-detail" class="panel hidden">
          <button id="back-to-devices">◀ Back</button>
          <h2 id="device-name">Device</h2>
          <p id="device-meta"></p>

          <div class="sensors">
            <h3>Sensors</h3>
            <ul id="sensors"></ul>
          </div>

          <div id="sensor-view" class="hidden">
            <h3 id="sensor-title">Sensor</h3>

            <div class="controls">
              <label>From: <input type="datetime-local" id="start" /></label>
              <label>To: <input type="datetime-local" id="end" /></label>
              <button id="refresh-logs">Refresh</button>
            </div>

            <div class="stats">
              <div>Count: <span id="stat-count">-</span></div>
              <div>Avg: <span id="stat-avg">-</span></div>
              <div>Min: <span id="stat-min">-</span></div>
              <div>Max: <span id="stat-max">-</span></div>
            </div>

            <canvas id="chart" height="140"></canvas>

            <table id="logs-table">
              <thead>
                <tr>
                  <th>ts</th>
                  <th>value</th>
                  <th>status</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
      <footer>
        <small>SmartHome UI — simple demo</small>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
